student.helpText=Practice: showing or skipping costs nothing. Your first answer to each logical question uses one free slot; repeats and revisions do not use another. Review remains available after your limit. Accuracy uses first answers.\n\nMocks: preparation costs nothing. The first answer uses one mock allowance. Resume the same exam from the menu. A configured timer starts when you open the first question and continues while you are away. You may change answers until submission or expiry.\n\nPractice and mock allowances are independent and never expire. Full explanations and your own history are available. Payment is not available in this phase.
