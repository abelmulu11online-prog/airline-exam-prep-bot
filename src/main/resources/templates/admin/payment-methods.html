<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Payment methods')}"></head><body>
<header th:replace="~{admin/fragments :: header}"></header><div class="shell"><nav th:replace="~{admin/fragments :: nav}"></nav><main>
<h1>Payment methods</h1><p>Public payment destinations only. Never enter PINs, passwords, or OTPs.</p>
<a class="button" th:href="@{/admin/payment-methods/new}">Add method</a>
<section class="panel"><table><thead><tr><th>Method</th><th>Type</th><th>Active</th><th>Order</th><th></th></tr></thead><tbody>
<tr th:each="row : ${rows}"><td th:text="${row.details.displayName}"></td><td th:text="${row.details.type}"></td>
<td th:text="${row.details.active}"></td><td th:text="${row.details.displayOrder}"></td>
<td><a th:href="@{/admin/payment-methods/{id}/edit(id=${row.id})}">Edit</a></td></tr></tbody></table></section>
<a th:if="${page > 0}" th:href="@{/admin/payment-methods(page=${page-1})}">Previous</a>
<a th:if="${rows.size()==20}" th:href="@{/admin/payment-methods(page=${page+1})}">Next</a>
</main></div></body></html>
