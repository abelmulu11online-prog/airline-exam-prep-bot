student.helpText=ልምምድ፦ ጥያቄን ማየት ወይም መዝለል ዕድል አይቀንስም። ለእያንዳንዱ አዲስ ጥያቄ የመጀመሪያ መልስ አንድ ነፃ ዕድል ይጠቀማል። መድገም ወይም የተሻሻለ ጥያቄ መመለስ ተጨማሪ ዕድል አይቀንስም። ትክክለኛነት በመጀመሪያ መልሶች ይለካል።\n\nየሙከራ ፈተና፦ ዝግጅት ዕድል አይቀንስም። የመጀመሪያ መልስ አንድ ዕድል ይጠቀማል። ከምናሌው ያልተጠናቀቀውን ፈተና ይቀጥሉ። የጊዜ ገደብ ካለ የመጀመሪያውን ጥያቄ ሲከፍቱ ይጀምራል፤ ቴሌግራምን ሲዘጉም ይቀጥላል። እስኪያስገቡ ወይም ጊዜው እስኪያበቃ መልስ መቀየር ይችላሉ።\n\nየልምምድና የፈተና ዕድሎች የተለያዩ ናቸው፤ በጊዜ አያልቁም። የራስዎን ውጤቶችና ማብራሪያዎች ማየት ይችላሉ። ክፍያ በዚህ ደረጃ አይገኝም።
